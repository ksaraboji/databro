name: Deploy Supabase Edge Functions Runner

'on':
  workflow_call:
    inputs:
      target_env:
        description: Target environment
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_PROJECT_REF:
        required: true
      CLOUDRUN_BASE_URL_DEV:
        required: true
      CLOUDRUN_BASE_URL_PROD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "SUPABASE_PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF }}" >> "$GITHUB_ENV"

          if [[ "${{ inputs.target_env }}" == "prod" ]]; then
            echo "ENV_NAME=prod" >> "$GITHUB_ENV"
            echo "CLOUDRUN_BASE_URL=${{ secrets.CLOUDRUN_BASE_URL_PROD }}" >> "$GITHUB_ENV"
          else
            echo "ENV_NAME=dev" >> "$GITHUB_ENV"
            echo "CLOUDRUN_BASE_URL=${{ secrets.CLOUDRUN_BASE_URL_DEV }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase project ref
        run: |
          if [[ -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "SUPABASE_PROJECT_REF is missing"
            exit 1
          fi

      - name: Push Supabase secrets
        run: |
          supabase secrets set \
            CLOUDRUN_BASE_URL="$CLOUDRUN_BASE_URL" \
            BACKEND_ENVIRONMENT="$ENV_NAME" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy ask-data edge function
        run: |
          supabase functions deploy ask-data \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deployment summary
        run: |
          echo "## Supabase deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $ENV_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project ref: $SUPABASE_PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function: ask-data" >> "$GITHUB_STEP_SUMMARY"

name: Deploy GCP Infrastructure

'on':
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/deploy-gcp-infra.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/deploy-gcp-infra.yml"
      - ".github/workflows/build-ai-backend-gcp.yml"
  workflow_run:
    workflows:
      - "Build and Push AI Backend (GCP)"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      ai_image:
        description: "Optional image URI override for Cloud Run"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-change-scope:
    name: Detect Change Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai_or_build_changed: ${{ steps.detect.outputs.ai_or_build_changed || steps.default_filter.outputs.ai_or_build_changed }}
      infra_gcp_changed: ${{ steps.detect.outputs.infra_gcp_changed || steps.default_filter.outputs.infra_gcp_changed }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          AI_OR_BUILD_CHANGED=false
          INFRA_GCP_CHANGED=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" == services/ai/* || "$file" == .github/workflows/build-ai-backend-gcp.yml ]]; then
              AI_OR_BUILD_CHANGED=true
            fi

            if [[ "$file" == terraform/gcp/* || "$file" == .github/workflows/deploy-gcp-infra.yml ]]; then
              INFRA_GCP_CHANGED=true
            fi
          done <<< "$CHANGED_FILES"

          echo "ai_or_build_changed=$AI_OR_BUILD_CHANGED" >> "$GITHUB_OUTPUT"
          echo "infra_gcp_changed=$INFRA_GCP_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Default path filter output for non-diff events
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        id: default_filter
        run: |
          echo "ai_or_build_changed=false" >> "$GITHUB_OUTPUT"
          echo "infra_gcp_changed=false" >> "$GITHUB_OUTPUT"

  terraform-dev:
    name: Terraform (gcp dev)
    needs: detect-change-scope
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-change-scope.outputs.infra_gcp_changed == 'true') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'dev')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Debug WIF Provider
        run: |
            echo "Provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}"
            echo "Service Account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_DEV }}"
            
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=backend-dev.hcl

      - name: Import existing Artifact Registry repos (dev)
        run: |
          AI_REPO_ID="$(grep -E '^artifact_registry_repository_id\s*=\s*"' dev.tfvars | head -n1 | cut -d'"' -f2)"

          if ! terraform state show google_artifact_registry_repository.ai_backend >/dev/null 2>&1; then
            if [[ -n "$AI_REPO_ID" ]] && gcloud artifacts repositories describe "$AI_REPO_ID" --location "us-east4" --project "${{ secrets.GCP_PROJECT_ID_DEV }}" >/dev/null 2>&1; then
              terraform import google_artifact_registry_repository.ai_backend "projects/${{ secrets.GCP_PROJECT_ID_DEV }}/locations/us-east4/repositories/$AI_REPO_ID" || true
            fi
          fi

          if ! terraform state show google_artifact_registry_repository.ollama_runtime >/dev/null 2>&1; then
            if gcloud artifacts repositories describe "ollama-runtime" --location "us-east4" --project "${{ secrets.GCP_PROJECT_ID_DEV }}" >/dev/null 2>&1; then
              terraform import google_artifact_registry_repository.ollama_runtime "projects/${{ secrets.GCP_PROJECT_ID_DEV }}/locations/us-east4/repositories/ollama-runtime" || true
            fi
          fi

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan (gcp dev)
        id: plan
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform plan -var-file=dev.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_DEV }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -input=false
        continue-on-error: true

      - name: Update Pull Request with Plan (gcp dev)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tfPlanOutput = `${{ steps.plan.outputs.stdout }}`;
            const comment = `## ☁️ GCP Terraform Plan - dev\n\n\`\`\`terraform\n${tfPlanOutput}\n\`\`\`\n\n**Plan Status**: ${{ steps.plan.outcome }}\n**Validation**: ${{ steps.validate.outcome }}\n**Format**: ${{ steps.fmt.outcome }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Terraform Apply - GCP Dev
        if: github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'dev') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop'))
        id: apply-dev
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform apply -var-file=dev.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_DEV }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -auto-approve -input=false

      - name: Terraform Output (gcp dev)
        if: github.event_name != 'pull_request'
        run: terraform output -no-color
        continue-on-error: true

  terraform-prod:
    name: Terraform (gcp prod)
    needs: detect-change-scope
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-change-scope.outputs.infra_gcp_changed == 'true') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=backend-prod.hcl

      - name: Import existing Artifact Registry repos (prod)
        run: |
          AI_REPO_ID="$(grep -E '^artifact_registry_repository_id\s*=\s*"' prod.tfvars | head -n1 | cut -d'"' -f2)"

          if ! terraform state show google_artifact_registry_repository.ai_backend >/dev/null 2>&1; then
            if [[ -n "$AI_REPO_ID" ]] && gcloud artifacts repositories describe "$AI_REPO_ID" --location "us-east4" --project "${{ secrets.GCP_PROJECT_ID_PROD }}" >/dev/null 2>&1; then
              terraform import google_artifact_registry_repository.ai_backend "projects/${{ secrets.GCP_PROJECT_ID_PROD }}/locations/us-east4/repositories/$AI_REPO_ID" || true
            fi
          fi

          if ! terraform state show google_artifact_registry_repository.ollama_runtime >/dev/null 2>&1; then
            if gcloud artifacts repositories describe "ollama-runtime" --location "us-east4" --project "${{ secrets.GCP_PROJECT_ID_PROD }}" >/dev/null 2>&1; then
              terraform import google_artifact_registry_repository.ollama_runtime "projects/${{ secrets.GCP_PROJECT_ID_PROD }}/locations/us-east4/repositories/ollama-runtime" || true
            fi
          fi

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan (gcp prod)
        id: plan
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform plan -var-file=prod.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_PROD }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -input=false
        continue-on-error: true

      - name: Update Pull Request with Plan (gcp prod)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tfPlanOutput = `${{ steps.plan.outputs.stdout }}`;
            const comment = `## ☁️ GCP Terraform Plan - prod\n\n\`\`\`terraform\n${tfPlanOutput}\n\`\`\`\n\n**Plan Status**: ${{ steps.plan.outcome }}\n**Validation**: ${{ steps.validate.outcome }}\n**Format**: ${{ steps.fmt.outcome }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Terraform Apply - GCP Prod
        if: github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'prod') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
        id: apply-prod
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform apply -var-file=prod.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_PROD }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -auto-approve -input=false

      - name: Terraform Output (gcp prod)
        if: github.event_name != 'pull_request'
        run: terraform output -no-color
        continue-on-error: true

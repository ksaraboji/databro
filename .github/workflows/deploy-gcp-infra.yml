name: Deploy GCP Infrastructure

'on':
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/deploy-gcp-infra.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/gcp/**"
      - ".github/workflows/deploy-gcp-infra.yml"
      - ".github/workflows/build-ai-backend-gcp.yml"
  workflow_run:
    workflows:
      - "Build and Push AI Backend (GCP)"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      ai_image:
        description: "Optional image URI override for Cloud Run"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-change-scope:
    name: Detect Change Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai_or_build_changed: ${{ steps.filter.outputs.ai_or_build || steps.default_filter.outputs.ai_or_build }}
      infra_gcp_changed: ${{ steps.filter.outputs.infra_gcp || steps.default_filter.outputs.infra_gcp }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ai_or_build:
              - 'services/ai/**'
              - '.github/workflows/build-ai-backend-gcp.yml'
            infra_gcp:
              - 'terraform/gcp/**'
              - '.github/workflows/deploy-gcp-infra.yml'

      - name: Default path filter output for non-diff events
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        id: default_filter
        run: |
          echo "ai_or_build=false" >> "$GITHUB_OUTPUT"
          echo "infra_gcp=false" >> "$GITHUB_OUTPUT"

  terraform-dev:
    name: Terraform (gcp dev)
    needs: detect-change-scope
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-change-scope.outputs.infra_gcp_changed == 'true' && needs.detect-change-scope.outputs.ai_or_build_changed != 'true') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'dev')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Debug WIF Provider
        run: |
            echo "Provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}"
            echo "Service Account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_DEV }}"
            
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=backend-dev.hcl

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan (gcp dev)
        id: plan
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform plan -var-file=dev.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_DEV }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -input=false
        continue-on-error: true

      - name: Update Pull Request with Plan (gcp dev)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tfPlanOutput = `${{ steps.plan.outputs.stdout }}`;
            const comment = `## ☁️ GCP Terraform Plan - dev\n\n\`\`\`terraform\n${tfPlanOutput}\n\`\`\`\n\n**Plan Status**: ${{ steps.plan.outcome }}\n**Validation**: ${{ steps.validate.outcome }}\n**Format**: ${{ steps.fmt.outcome }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Terraform Apply - GCP Dev
        if: github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'dev') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop'))
        id: apply-dev
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform apply -var-file=dev.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_DEV }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -auto-approve -input=false

      - name: Terraform Output (gcp dev)
        if: github.event_name != 'pull_request'
        run: terraform output -no-color
        continue-on-error: true

  terraform-prod:
    name: Terraform (gcp prod)
    needs: detect-change-scope
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-change-scope.outputs.infra_gcp_changed == 'true' && needs.detect-change-scope.outputs.ai_or_build_changed != 'true') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/gcp
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config=backend-prod.hcl

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan (gcp prod)
        id: plan
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform plan -var-file=prod.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_PROD }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -input=false
        continue-on-error: true

      - name: Update Pull Request with Plan (gcp prod)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tfPlanOutput = `${{ steps.plan.outputs.stdout }}`;
            const comment = `## ☁️ GCP Terraform Plan - prod\n\n\`\`\`terraform\n${tfPlanOutput}\n\`\`\`\n\n**Plan Status**: ${{ steps.plan.outcome }}\n**Validation**: ${{ steps.validate.outcome }}\n**Format**: ${{ steps.fmt.outcome }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Terraform Apply - GCP Prod
        if: github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'prod') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
        id: apply-prod
        run: |
          EXTRA_VAR=""
          if [ -n "${{ github.event.inputs.ai_image }}" ]; then
            EXTRA_VAR="-var=ai_backend_image=${{ github.event.inputs.ai_image }}"
          fi
          terraform apply -var-file=prod.tfvars \
            -var="project_id=${{ secrets.GCP_PROJECT_ID_PROD }}" \
            -var="hf_api_token=${{ secrets.HF_API_TOKEN }}" \
            $EXTRA_VAR -no-color -auto-approve -input=false

      - name: Terraform Output (gcp prod)
        if: github.event_name != 'pull_request'
        run: terraform output -no-color
        continue-on-error: true
